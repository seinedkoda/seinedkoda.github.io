{{ define "main" }}
{{ with resources.Get "css/about.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
{{ end }}

<article class="post-single">

  <h2>{{ .Title }}</h2>

  <div class="post-single-content">
    {{ .Content }}
  </div>

</article>
{{ end }}
